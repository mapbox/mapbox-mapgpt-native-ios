name: SPMTest
options:
  bundleIdPrefix: com.mapbox.mapGpt.SPM
packages:
  MapboxMapGpt:
    url: git@github.com:mapbox/mapbox-mapgpt-ios.git
    branch: release/v24.14.0
targets:
  SPMTest:
    type: application
    platform: iOS
    deploymentTarget: "13.2"
    sources: [Sources]
    dependencies:
      - sdk: libc++.tbd
      - package: MapboxMapGpt
    settings:
        DEVELOPMENT_TEAM: "GJZR2MEM28"
        OTHER_LDFLAGS: "-lc++"
