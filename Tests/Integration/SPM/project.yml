name: SPMTest
options:
  bundleIdPrefix: com.mapbox.mapGpt.SPM
packages:
  MapboxMapGptNative:
    url: git@github.com:mapbox/mapbox-mapgpt-native-ios.git
    branch: v24.31.0
targets:
  SPMTest:
    type: application
    platform: iOS
    deploymentTarget: "13.2"
    sources: [Sources]
    dependencies:
      - sdk: libc++.tbd
      - package: MapboxMapGptNative
    settings:
        DEVELOPMENT_TEAM: "GJZR2MEM28"
        OTHER_LDFLAGS: "-lc++"
